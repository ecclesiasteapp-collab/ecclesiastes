name: ecclesiastes
description: "Application de gestion Ecclesiastes pour le Champ Kin Sud-Ouest - Eglise Néo-Apostolique."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- GESTION DE LA BASE DE DONNÉES --
  sqflite: ^2.3.0
  path: ^1.8.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0

  # --- GESTION D'ÉTAT --
  provider: ^6.0.0
  flutter_riverpod: ^2.4.0
  riverpod: ^2.4.0

  # --- STOCKAGE SÉCURISÉ --
  flutter_secure_storage: ^10.3.1

  # --- UI ET ICONS --
  cupertino_icons: ^1.0.2
  intl: ^0.20.2
  fl_chart: ^1.2.0
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0

  # --- CONNECTIVITÉ ET SYNC --
  connectivity_plus: ^7.1.1
  workmanager: ^0.9.0+3

  # --- SERVICES PDF ET IMPRESSION --
  pdf: ^3.10.4
  printing: ^5.11.0
  path_provider: ^2.1.1
  open_filex: ^4.5.0

  # --- GÉNÉRATION DE CODES --
  qr_flutter: ^4.1.0
  barcode: ^2.2.6
  uuid: ^4.2.2
  crypto: ^3.0.3

  # --- CALENDRIER ET DATE --
  table_calendar: ^3.1.2
  syncfusion_flutter_calendar: ^33.2.10

  # --- NOTIFICATIONS --
  flutter_local_notifications: ^21.0.0

  # --- LOGGING --
  logger: ^2.0.0

  # --- IMAGES ET FICHIERS --
  image_picker: ^1.0.4
  file_picker: ^8.1.2
  share_plus: ^12.0.2
  screenshot: ^3.0.0
  signature: ^5.4.0

  # --- AUDIO ET SPEECH --
  record: ^7.0.0
  audioplayers: ^6.7.0
  speech_to_text: ^7.4.0

  # --- NETWORKING --
  http: ^1.1.0
  dio: ^5.3.0
  url_launcher: ^6.2.5

  # --- UTILS --
  timezone: ^0.11.0
  encrypt: ^5.0.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  mockito: ^5.4.4
flutter:
  uses-material-design: true
    
  assets:
     - assets/images/
     - assets/library/
     - assets/schemas/
