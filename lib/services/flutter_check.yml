name: Ecclesiastes Quality Check
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Verify Build Runner (No changes expected)
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
          git diff --exit-code || (echo "Erreur: Les fichiers générés ne sont pas à jour. Lancez build_runner en local." && exit 1)
      - name: Run Lints
        run: flutter analyze
      - name: Run Tests
        run: flutter test