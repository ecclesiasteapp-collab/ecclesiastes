<html>

    For more details:

    <div style="width: 60px; height: 60px; border: 4px solid rgba(0, 51, 102, 0.1); border-top: 4px solid #003366; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    <p style="margin-top: 24px; font-weight: bold; letter-spacing: 2px; font-size: 18px;">ECCLÉSIASTE</p>
    <p style="margin-top: 8px; font-size: 12px; color: #666;">Initialisation du système...</p>
  </div>
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('load', function(ev) {
      // Le chargement de Flutter va remplacer le contenu du body
    });
